<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ef" />
    <title>Food — калькулятор блюд</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f;background:#f7f7f8">
        <div style="text-align:center">
          <div style="font-size:42px;margin-bottom:12px">◌</div>
          <strong style="font-size:22px">Food загружается…</strong>
        </div>
      </main>
    </div>
    <script type="module">
      import('./src/main.jsx').catch(error => {
        console.error('Food startup error:', error)
        const root = document.getElementById('root')
        if (root) {
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;color:#1d1d1f;background:#f7f7f8"><div style="max-width:560px;text-align:center"><div style="font-size:42px;margin-bottom:12px">⚠️</div><strong style="font-size:22px">Food не удалось загрузить</strong><p style="margin-top:10px;color:#666;line-height:1.5">Ошибка запуска JavaScript. Обновите страницу. Если ошибка повторится, приложение покажет причину в консоли.</p></div></main>'
        }
      })
    </script>
  </body>
</html>

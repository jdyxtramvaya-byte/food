<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ef" />
    <title>Food — калькулятор блюд</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f;background:#f7f7f8">
        <div style="text-align:center">
          <div style="font-size:42px;margin-bottom:12px">◌</div>
          <strong style="font-size:22px">Food загружается…</strong>
        </div>
      </main>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root=document.getElementById('root');
        if(root&&e.message){root.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#1d1d1f;background:#f7f7f8"><div style="max-width:720px;text-align:center"><strong style="font-size:22px">Food: ошибка запуска</strong><p style="margin-top:12px;line-height:1.5">'+String(e.message).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})+'</p></div></main>';}
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root=document.getElementById('root');
        if(root&&e.reason){root.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#1d1d1f;background:#f7f7f8"><div style="max-width:720px;text-align:center"><strong style="font-size:22px">Food: ошибка запуска</strong><p style="margin-top:12px;line-height:1.5">'+String(e.reason&&e.reason.message||e.reason).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})+'</p></div></main>';}
      });
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
